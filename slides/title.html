<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  .slide-container { width:1280px; min-height:720px; background:#f6f1e3; font-family:'Segoe UI',Arial,sans-serif; position:relative; overflow:hidden; }
  .gold-bar { position:absolute; left:0; top:0; width:14px; height:720px; background:linear-gradient(180deg,#c9a227,#a8861c); }
  .circle1 { position:absolute; right:-120px; top:-120px; width:380px; height:380px; border-radius:50%; background:radial-gradient(circle,#2f5233 0%,#2f5233 62%,transparent 63%); opacity:.12; }
  .circle2 { position:absolute; right:60px; bottom:-140px; width:300px; height:300px; border-radius:50%; border:26px solid #c9a227; opacity:.18; }
  .inner { position:relative; padding:90px 90px 0 90px; }
  .kicker { color:#2f5233; letter-spacing:6px; font-size:15px; font-weight:600; text-transform:uppercase; }
  .wordmark { font-size:110px; font-weight:800; color:#2f5233; line-height:1; margin-top:18px; }
  .wordmark span { color:#c9a227; }
  .slogan { font-size:30px; color:#424242; margin-top:26px; font-weight:500; }
  .rule { width:120px; height:6px; background:#c9a227; border-radius:3px; margin-top:34px; }
  .position { font-size:19px; color:#5a5344; margin-top:30px; max-width:760px; line-height:1.6; }
  .tag { display:inline-block; margin-top:46px; background:#2f5233; color:#f6f1e3; padding:12px 26px; border-radius:30px; font-size:16px; font-weight:600; letter-spacing:1px; }
  .tag b { color:#e7c95a; }
</style>
</head>
<body>
<div class="slide-container">
  <div class="gold-bar"></div>
  <div class="circle1"></div>
  <div class="circle2"></div>
  <div class="inner">
    <div class="kicker">Saudi Route Intelligence</div>
    <div class="wordmark">TRIP<span>SA</span></div>
    <div class="slogan">Plan your Saudi road trip with intelligence.</div>
    <div class="rule"></div>
    <div class="position">The smart layer that turns Saudi tourism content into living, optimized, group-friendly road-trip experiences.</div>
    <div class="tag">Tourism Development Fund <b>Hackathon</b></div>
  </div>
</div>
</body>
</html>
